name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Include AR libraries in the website
        run: |
          npm install --no-save @8thwall/engine-binary@1 @8thwall/xrextras@1 @8thwall/landing-page@1
          mkdir -p external/vendor
          cp -R node_modules/@8thwall/engine-binary external/vendor/engine-binary
          cp -R node_modules/@8thwall/xrextras external/vendor/xrextras
          cp -R node_modules/@8thwall/landing-page external/vendor/landing-page
          
      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
